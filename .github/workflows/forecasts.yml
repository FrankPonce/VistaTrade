# Refreshes the model's forecasts after every US trading day.
# Needs repository secrets ALPACA_KEY_ID and ALPACA_SECRET_KEY
# (Settings > Secrets and variables > Actions).
name: Daily forecasts

on:
  schedule:
    # 22:30 UTC on weekdays: after the 16:00 New York close in both EST and EDT.
    - cron: '30 22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forecasts
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Download prices
        working-directory: ml
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python fetch.py

      - name: Backtest and forecast
        working-directory: ml
        run: python train.py

      - name: Commit new forecasts
        run: |
          git config user.name "vistatrade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/forecasts/latest.json ml/results/backtest.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update forecasts ($(date -u +%F))"
          git push
